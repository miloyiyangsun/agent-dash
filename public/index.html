<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 观测台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='27' fill='%23c4532a'/><circle cx='32' cy='32' r='20' fill='none' stroke='%23ece5d6' stroke-width='2' opacity='.78'/><circle cx='32' cy='32' r='3.2' fill='%23ece5d6' opacity='.9'/></svg>">
<style>
  /* Colour tokens live in /ui/tokens.css; theme.css keeps the legacy aliases. */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 24px; margin-bottom: 16px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .agent-logo { width: 20px; height: 20px; object-fit: contain; padding: 1px; flex: none; }
  @media (prefers-color-scheme: dark) {
    .agent-logo.mono { filter: invert(1); }
  }
  label.tog { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 5px 11px; border-radius: 8px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .btn:hover { color: var(--ink); border-color: var(--faint); }
  button:focus-visible, select:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--tool); outline-offset: 3px; }
  .settings > summary { min-height: 36px; display: inline-flex; align-items: center; white-space: nowrap; }
  .settings > summary { list-style: none; gap: 7px; color: var(--ink); }
  .settings > summary::-webkit-details-marker { display: none; }
  /* A drawn chevron sits on the text's centre line; the ⌄ glyph hangs below it in most fonts. */
  .settings > summary::after { content: ""; flex: none; width: 6px; height: 6px; margin: -3px 1px 0 2px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(45deg); transition: transform .2s ease, margin .2s ease; }
  .settings[open] > summary { background: var(--line); }
  .settings[open] > summary::after { margin-top: 3px; transform: rotate(-135deg); }
  .settings-panel { position: absolute; z-index: 20; right: 0; top: calc(100% + 10px); width: min(360px, calc(100vw - 32px)); max-height: calc(100dvh - 180px); overflow-y: auto; overscroll-behavior: contain; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow-float); }
  .setting-group + .setting-group { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .setting-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 9px; }
  .setting-toggles { display: grid; gap: 12px; margin-top: 14px; }
  .setting-toggles .tog { color: var(--ink); gap: 8px; }
  .tog input { accent-color: var(--tool); margin: 0; width: 15px; height: 15px; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .setting-row .setting-label { margin: 0; }

  .today-note { margin-top: 12px; line-height: 1.5; }
  .today-big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .today-big div { padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .today-big b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .today-big span, .today-note, .today-head { font-size: 12px; color: var(--muted); }
  .today-head { margin: 12px 0 6px; font-weight: 600; }
  .today-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
  .today-row .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* ---- toolbar menus and controls, styled to match (no browser defaults) */
  details.menu > summary { gap: 7px; }
  .scene-ico { display: inline-flex; }
  .scene-art { width: 18px; height: 18px; flex: none; display: block; object-fit: contain; }
  .scene-list .thumb .scene-art { width: 22px; height: 22px; }
  #sceneName { max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Scene, agent and language menus share one compact list. */
  .list-panel { width: 250px; padding: 12px; }
  .scene-panel { right: auto; left: 0; }
  .pick-list { display: flex; flex-direction: column; gap: 1px; margin-top: 8px; }
  .pick-list button { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 34px; padding: 6px 8px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; }
  .pick-list button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .pick-list .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick-list small { color: var(--faint); font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }
  .pick-list .chk { flex: none; opacity: 0; color: var(--tool); }
  .pick-list button.on { font-weight: 600; }
  .pick-list button.on .chk { opacity: 1; }
  .pick-list .agent-logo { width: 16px; height: 16px; margin: 0; }
  .scene-list .thumb { flex: none; width: 44px; height: 28px; border-radius: 5px; overflow: hidden; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 7%, var(--panel)); color: var(--muted); }
  .scene-list .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Agent rows: a checkbox square, the logo, the name and a count */
  #agentChips .box { flex: none; display: grid; place-items: center; width: 16px; height: 16px; border: 1.5px solid color-mix(in srgb, var(--ink) 30%, var(--line)); border-radius: 4px; }
  #agentChips .box .chk { width: 12px; height: 12px; opacity: 0; color: var(--on-accent); stroke-width: 2.6; }
  #agentChips .on .box { background: var(--tool); border-color: var(--tool); }
  #agentChips .on .box .chk { opacity: 1; }
  #agentChips .chip-f > .chk, #agentChips button > svg.chk:last-child { display: none; }
  #agentChips b { font-weight: 500; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  #agentChips .ini { font-size: 11px; color: var(--muted); width: 16px; text-align: center; }
  details.menu.active > summary { border-color: color-mix(in srgb, var(--tool) 55%, var(--line)); }
  .prefs-panel { width: 280px; }
  .prefs-panel .setting-toggles { display: flex; flex-direction: column; gap: 2px; margin: 0 0 12px; }
  /* Switches instead of checkboxes */
  .prefs-panel label.tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 2px; font-size: 13.5px; color: var(--ink); cursor: pointer; }
  .tog input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 36px; height: 21px; margin: 0; border-radius: 999px; background: color-mix(in srgb, var(--ink) 18%, var(--panel)); cursor: pointer; transition: background .18s; }
  .tog input::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 16px; height: 16px; border-radius: 50%; background: var(--knob); box-shadow: var(--shadow-knob); transition: transform .18s cubic-bezier(.2, .8, .2, 1); }
  .tog input:checked { background: var(--tool); }
  .tog input:checked::after { transform: translateX(15px); }
  .tog input:focus-visible { outline: 2px solid var(--tool); outline-offset: 2px; }
  .tog-note { margin: 0 2px 4px; font-size: 12px; line-height: 1.5; color: var(--muted); }
  .prefs-panel .setting-toggles:last-of-type { margin-bottom: 4px; }
  /* ---- full-screen mode: the office fills the window */
  .ui-ico { stroke-width: 1.8; }
  body.full { overflow: hidden; padding: 0; margin: 0; height: 100dvh; }
  body.full .wrap { max-width: none; height: 100dvh; padding: 0; display: flex; flex-direction: column; }
  body.full header { flex-wrap: wrap; gap: 8px 14px; margin: 0; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  /* The office owns the whole stage in full-screen mode; no side panel inset. */
  body.full #officeWrap { position: relative; flex: 1; min-height: 0; }
  body.full .office { height: 100%; min-height: 0; border: 0; border-radius: 0; }
  body.full .legend { position: absolute; left: auto; right: 12px; bottom: 10px; margin: 0; padding: 5px 8px; gap: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(6px); font-size: var(--fs-11); }
  body.full .legend .dot { width: 6px; height: 6px; }
  body.full .legend .agent-logo { width: 12px; height: 12px; padding: 0; }
  body.full #agentLegend { bottom: 42px; }
  /* The video pop-out preview and its errors float over the office instead of pushing it down. */
  body.full .pip-preview { position: fixed; z-index: 25; left: 16px; bottom: 84px; width: min(360px, calc(100vw - 32px)); margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow-float); }
  body.full .pip-preview video { width: 100%; height: auto; border-radius: 8px; }
  body.full .pip-preview p { margin: 0 0 8px; font-size: 12px; }
  body.full .pip-error { position: fixed; z-index: 25; left: 50%; top: calc(var(--bar, 53px) + 12px); transform: translateX(-50%); margin: 0; padding: 8px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-float); }
  .icon-btn { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
  .icon-btn:hover { color: var(--ink); }
  @media (max-width: 900px) {
    body.full #settingsMenu > summary [data-t] { display: none; }
  }
  /* Phones: one row of icon buttons; the labels, chevrons and pop-out (unsupported there) go. */
  @media (max-width: 640px) {
    html body.full header { padding: 8px 10px; gap: 6px; flex-wrap: nowrap; }
    body.full details.menu > summary { gap: 0; padding-inline: 9px; }
    body.full #sceneMenu > summary { gap: 6px; }
    body.full #sceneName { max-width: 6.5em; }
    body.full details.menu > summary::after,
    body.full #agentName,
    body.full #settingsMenu > summary [data-t] { display: none; }
    body.full details.menu.active > summary { position: relative; }
    body.full details.menu.active > summary::before { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--tool); }
  }
  @media (max-width: 359px) { body.full #sceneName { display: none; } }
  @media (max-width: 760px) {
    body.full header { flex-wrap: wrap; }
    /* Menus span the screen under the toolbar instead of hanging off their button. */
    body.full .settings-panel { position: fixed; left: auto; right: 12px; max-width: calc(100vw - 24px); top: calc(var(--bar, 53px) + 6px); max-height: calc(100dvh - var(--bar, 53px) - 24px); }
  }
  .ui-ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  [data-s="thinking"] { --s: var(--st-thinking); }
  [data-s="tool"] { --s: var(--st-tool); }
  [data-s="typing"] { --s: var(--st-typing); }
  [data-s="waiting"] { --s: var(--st-waiting); }
  [data-s="directing"] { --s: var(--st-directing); }
  [data-s="done"] { --s: var(--st-done); }
  [data-s="interrupted"] { --s: var(--st-interrupted); }
  [data-s="error"] { --s: var(--st-error); }
  [data-s="idle"] { --s: var(--st-interrupted); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .office { position: relative; height: min(74vh, 820px); min-height: 380px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
  .office-canvas { display: block; }
  .office canvas { transition: opacity .35s; }
  .office.loading canvas { opacity: 0; }
  .office-loader { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 13px; z-index: 2; }
  .office.loading .office-loader { display: flex; }
  .office-loader .spin { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--tool); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .office-gl, .office-overlay { position: absolute; inset: 0; }
  .office-overlay { touch-action: none; }
  #officeWrap { position: relative; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  .pip-preview { margin-bottom: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .pip-preview p { margin: 0 0 10px; color: var(--muted); }
  .pip-preview video { display: block; width: min(100%, 520px); margin-bottom: 10px; background: var(--panel); }
  .pip-error { color: var(--error); margin: 0 0 12px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 16px; border: 1px dashed var(--line); border-radius: 12px; }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 4px; }
  .conn { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--error); color: var(--on-accent); padding: 6px 14px; border-radius: 999px; font-size: 12.5px; display: none; }
  .conn.on { display: block; }

  /* The PiP iframe owns its animation clock, layout, and pointer events. */
  body.pip { padding: 8px; }
  body.pip .wrap { height: calc(100dvh - 16px); display: flex; flex-direction: column; }
  body.pip header { gap: 6px; margin-bottom: 8px; flex: none; }
  body.pip #legend { display: none !important; }
  body.pip #officeWrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.pip .office { flex: 1; height: auto; min-height: 120px; }
  body.pip #main { overflow: auto; min-height: 0; }
  body.pip #main:empty { display: none; }
</style>
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="wrap">
  <header id="topbar">
    <div class="tb-left">
      <button class="tb-tasks" id="tbTasks" type="button" data-a="wbTasks" title="任务"><svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg><span data-t="wbTasks"></span></button>
      <span class="brand-seal" aria-hidden="true"></span>
      <span class="brand" data-t="brand"></span>
      <svg class="heartbeat" id="heartbeat" viewBox="0 0 72 18" width="72" height="18" aria-hidden="true"><polyline id="hbLine" points=""></polyline></svg>
      <div class="tb-counts" id="tbCounts">
        <button type="button" class="tb-count" data-wb-filter="needsYou"><span class="ui-dot st-waiting"></span><span data-t="needsYou"></span> <b class="ui-num" id="cntNeeds">0</b></button>
        <span class="tb-dot-sep" aria-hidden="true">·</span>
        <button type="button" class="tb-count" data-wb-filter="working"><span class="ui-dot st-tool"></span><span data-t="working"></span> <b class="ui-num" id="cntWorking">0</b></button>
        <span class="tb-dot-sep" aria-hidden="true">·</span>
        <button type="button" class="tb-count" data-wb-filter="finished"><span class="ui-dot st-done"></span><span data-t="finished"></span> <b class="ui-num" id="cntFinished">0</b></button>
        <span class="tb-dot-sep" id="sepError" aria-hidden="true" hidden>·</span>
        <button type="button" class="tb-count" data-wb-filter="error" id="btnError" hidden><span class="ui-dot st-error"></span><span data-t="error"></span> <b class="ui-num" id="cntError">0</b></button>
      </div>
    </div>
    <div class="tb-center">
      <nav class="ui-seg view-seg" id="viewSeg" aria-label="跳到某一屏" data-a="screenNav">
        <button type="button" data-screen="office" data-t="viewOffice"></button>
        <button type="button" data-screen="topo" data-t="viewTopo"></button>
        <button type="button" data-screen="workbench" data-t="viewWorkbench"></button>
        <button type="button" data-screen="timeline" data-t="viewTimeline"></button>
      </nav>
    </div>
    <div class="tb-right">
      <label class="tb-search">
        <svg class="ui-ico tb-search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input class="ui-input" id="wbSearch" type="search" autocomplete="off" spellcheck="false">
        <span class="ui-kbd tb-kbd">Ctrl K</span>
      </label>
      <details class="settings menu" id="settingsMenu">
        <summary class="ui-btn tb-settings" aria-controls="settingsPanel" data-a="settings"><svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.5 7.5 0 0 0-2.6-1.5L14.1 2.6h-4l-.4 2.4A7.5 7.5 0 0 0 7.1 6.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9a7.5 7.5 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a7.5 7.5 0 0 0 2.6-1.5l2.3.9 2-3.4z"/></svg></summary>
        <div class="settings-panel prefs-panel" id="settingsPanel">
          <div class="setting-group">
            <span class="setting-label" data-t="groupDisplay"></span>
            <div class="setting-row"><span class="setting-sub" data-t="theme"></span></div>
            <div class="ui-seg" id="themeSeg" role="group" data-a="theme">
              <button data-theme-v="auto" data-t="themeAuto"></button>
              <button data-theme-v="dark" data-t="themeDark"></button>
              <button data-theme-v="light" data-t="themeLight"></button>
            </div>
            <div class="setting-row"><label class="setting-sub" for="langSelect" data-t="language"></label></div>
            <select class="ui-input" id="langSelect"></select>
            <div class="setting-row"><label class="setting-sub" for="qualitySelect" data-t="qualityL"></label></div>
            <select class="ui-input" id="qualitySelect">
              <option value="mid" data-t="qMid"></option>
              <option value="high" data-t="qHigh"></option>
            </select>
            <div class="setting-toggles">
              <label class="tog" id="agentBadgeToggle"><span data-t="showAgent"></span><input type="checkbox" role="switch" id="showAgent"></label>
            </div>
            <button class="ui-btn setting-wide" id="pipBtn" hidden></button>
          </div>
          <div class="setting-group">
            <span class="setting-label" data-t="groupData"></span>
            <div class="setting-row"><span class="setting-sub" data-t="agents"></span><span class="setting-value" id="agentName"></span></div>
            <div class="pick-list" id="agentChips" role="group"></div>
            <div class="setting-toggles">
              <label class="tog"><span data-t="subagents"></span><input type="checkbox" role="switch" id="showSub"></label>
              <label class="tog" id="idleToggle"><span data-t="showIdle"></span><input type="checkbox" role="switch" id="showIdle"></label>
            </div>
            <div class="setting-row"><span class="setting-sub" data-t="today"></span><span class="ui-num setting-value" id="todayTokens"></span></div>
            <div id="todayPanel"></div>
          </div>
          <div class="setting-group">
            <span class="setting-label" data-t="groupSoundNotify"></span>
            <div class="setting-toggles">
              <label class="tog" id="soundToggle"><span data-t="sound"></span><input type="checkbox" role="switch" id="sound"></label>
              <label class="tog" id="notifyToggle"><span data-t="notify"></span><input type="checkbox" role="switch" id="notify"></label>
            </div>
            <p class="tog-note" id="notifyNote" data-t="notifyBlocked" hidden></p>
          </div>
          <div class="setting-group">
            <span class="setting-label" data-t="groupAbout"></span>
            <div class="setting-row"><span class="setting-sub" data-t="versionL"></span><span class="setting-value ui-num" id="aboutVer"></span></div>
            <p class="tog-note" id="aboutNote"></p>
          </div>
        </div>
      </details>
    </div>
  </header>
  <p class="pip-error" id="pipError" role="alert" hidden></p>
  <div class="pip-preview" id="pipPreview" hidden>
    <p data-t="pipVideoHint"></p>
    <video id="pipVideo" controls autoplay muted playsinline aria-label="Office video preview"></video>
    <button class="btn" id="videoPipBtn" data-t="pip" hidden></button>
    <button class="btn" id="closePreview" data-t="pipStop"></button>
  </div>
  <div id="pager">
  <section class="screen" id="office" aria-labelledby="screenOfficeH">
    <div class="screen-head">
      <h2 class="screen-h" id="screenOfficeH" data-t="viewOffice"></h2>
      <span class="screen-desc" data-t="screenOfficeDesc"></span>
      <button type="button" class="screen-agent-btn" id="agentBtnOffice" data-t="drawerTitle"></button>
    </div>
    <div class="screen-body" id="officeBody">
  <div id="officeWrap">
    <div class="office-tools">
      <div class="ui-seg" id="qualSeg" role="group">
        <button type="button" data-v="mid" data-t="qMid"></button>
        <button type="button" data-v="high" data-t="qHigh"></button>
      </div>
      <details class="settings menu" id="sceneMenu">
        <summary class="ui-btn" aria-controls="scenePanel" data-a="scene"><span class="scene-ico" id="sceneIco"></span><span id="sceneName"></span></summary>
        <div class="settings-panel list-panel scene-panel" id="scenePanel">
          <div class="setting-label" data-t="scene"></div>
          <div class="pick-list scene-list" id="sceneSeg" role="group"></div>
        </div>
      </details>
    </div>
    <div class="office loading" id="officeStage"><div class="office-loader"><div class="spin"></div><span id="loaderText"></span></div></div>
    <div class="legend" id="legend"></div>
    <div class="legend" id="agentLegend" hidden></div>
  </div>
    <div class="screen-empty" id="officeEmpty" hidden></div>
    </div>
    <button type="button" class="scroll-hint" id="scrollHint"><span data-t="scrollHint"></span></button>
  </section>

<script>
// Language: your pick in the 🌐 menu, else the language of your prompts
// (the server guesses it), else the browser's, else English.
let L = I18N.en;
let langCode = 'en';
let rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto', style: 'short' });
const tr = (k) => L[k] ?? (langCode.startsWith('zh') ? I18N['zh-CN'][k] : undefined) ?? I18N.en[k] ?? k;
function chooseLang(serverGuess) {
  const pick = store.get('lang', 'auto');
  if (pick !== 'auto' && I18N[pick]) return pick;
  if (serverGuess && I18N[serverGuess]) return serverGuess;
  const guess = i18nFromBrowser(navigator.languages || [navigator.language]);
  // This board is read in Chinese; a browser we can't place still gets
  // Simplified Chinese rather than English.
  if (guess && I18N[guess]) return guess.startsWith('zh') ? 'zh-CN' : guess;
  return 'zh-CN';
}
function applyLang(code) {
  if (code === langCode && L === I18N[code] && document.documentElement.dataset.localized) return;
  document.documentElement.dataset.localized = 'true';
  langCode = code;
  L = I18N[code];
  document.documentElement.lang = L.html;
  rtf = new Intl.RelativeTimeFormat(L.html, { numeric: 'auto', style: 'short' });
  // New keys fall back to Simplified Chinese for any zh variant, then English.
  const t = tr;
  document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = t(el.dataset.t)));
  document.querySelectorAll('[data-a]').forEach((el) => { const v = t(el.dataset.a); el.setAttribute('aria-label', v); el.title = v; });
  const searchEl = document.getElementById('wbSearch');
  if (searchEl) searchEl.placeholder = t('searchPlaceholder');
  if (typeof syncViewSeg === 'function') syncViewSeg();
  requestAnimationFrame(syncTopbar);
  const legend = document.getElementById('legend');
  if (legend) legend.innerHTML = ['thinking', 'tool', 'typing', 'waiting', 'directing', 'done', 'error', 'interrupted', 'idle']
    .map((k) => `<span data-s="${k}"><span class="dot" style="color:var(--s)"></span>${L[k]}</span>`).join('');
  if (typeof renderLangMenu === 'function') renderLangMenu();
  if (typeof office !== 'undefined' && office) office.offDutyLabel = L.wentHome;
  if (typeof syncControls === 'function') syncControls();
  if (typeof renderSceneSel === 'function') renderSceneSel();
  if (typeof renderVersion === 'function') renderVersion();
  window.WbDetail?.onLang?.();
  window.WbAside?.onLang?.();
  window.Timeline?.onLang?.();
  window.Workbench?.onLang?.();
  window.Topo?.onLang?.();
  window.AgentDrawer?.onLang?.();
}

const store = (() => {
  const fallback = new Map();
  const get = (k, d) => { try { const v = localStorage.getItem('wmad.' + k); return v == null ? d : JSON.parse(v); } catch { return fallback.has(k) ? fallback.get(k) : d; } };
  const set = (k, v) => { fallback.set(k, v); try { localStorage.setItem('wmad.' + k, JSON.stringify(v)); } catch {} };
  return { get, set };
})();

const PREF_DEFAULTS = { quality: 'mid', scene: 'office', agents: [], showSub: false, showIdle: false, showAgent: true, sound: true, notify: true, lang: 'auto', theme: 'auto' };
function validAgentId(v) {
  return typeof v === 'string' && v !== 'all' && /^[a-zA-Z][a-zA-Z0-9_-]{0,63}$/.test(v) && !Object.hasOwn(Object.prototype, v);
}
function validPreference(k, v) {
  if (!Object.hasOwn(PREF_DEFAULTS, k)) return false;
  if (typeof PREF_DEFAULTS[k] === 'boolean') return typeof v === 'boolean';
  if (k === 'quality') return ['mid', 'high'].includes(v);
  if (k === 'theme') return ['auto', 'dark', 'light'].includes(v);
  // Which agents to show; none selected means all of them.
  if (k === 'agents') return Array.isArray(v) && v.length <= 32 && v.every(validAgentId);
  if (k === 'lang') return v === 'auto' || Object.hasOwn(I18N, v);
  return typeof v === 'string' && /^[a-z0-9-]+$/.test(v);
}
// The filter used to be one agent or 'all'; carry an old single choice over once.
{
  const old = store.get('agent', 'all');
  if (validAgentId(old) && !store.get('agents', []).length) store.set('agents', [old]);
  if (old !== 'all') store.set('agent', 'all');
}
function readPreferences() {
  return Object.fromEntries(Object.entries(PREF_DEFAULTS).map(([k, d]) => {
    const v = store.get(k, d);
    return [k, validPreference(k, v) ? v : d];
  }));
}
// Theme: follow the system unless the person picked dark or light.
function syncTheme() {
  document.querySelectorAll('#themeSeg button').forEach((b) => {
    const on = b.dataset.themeV === state.theme;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
}
function applyTheme() {
  const t = state.theme;
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  syncTheme();
  window.dispatchEvent(new Event('wmad:theme'));
}
const PIP = new URLSearchParams(location.search).get('pip') === '1';
if (PIP) document.body.classList.add('pip');

// ?view=office&quality=high&scene=pirate (what `--scene` opens) sets the prefs.
{
  const q = new URLSearchParams(location.search);
  if (PIP) {
    try {
      for (const [k, v] of Object.entries(JSON.parse(q.get('prefs')) || {})) if (validPreference(k, v)) store.set(k, v);
    } catch { /* malformed preferences use the saved defaults */ }
  }
  for (const k of ['quality', 'scene', 'lang']) if (validPreference(k, q.get(k))) store.set(k, q.get(k));
  if (location.search) history.replaceState(null, '', location.pathname + (PIP ? '?pip=1' : '') + location.hash);
}

const state = {
  ...readPreferences(),
  // The dashboard is always the full-window office with the agent panel; the pop-out keeps its compact views.
  full: !PIP,
  // Which screen of the long page is in view (office / topo / workbench / timeline).
  view: 'office',
  scenes: [],
  data: { now: Date.now(), sessions: [] },
  skew: 0,
  prev: new Map(),
  prevStuck: new Set(),
  flash: new Set(),
  // Workbench state is shared with the top bar and public/ui/workbench.js.
  wbSel: null,
  wbFilter: 'all',
  wbQuery: '',
};
applyTheme();
let popout = null;

const ACTIVE = new Set(['thinking', 'tool', 'typing', 'directing']);
const AGENT_NAME = Object.fromEntries(Object.entries(OFFICE_AGENT_BADGES).map(([agent, badge]) => [agent, badge.label]));

// Top-bar heartbeat: active sessions sampled every 10 s, 60 samples = 10 min.
const HB_LEN = 60;
const hbPoints = [];
let hbReady = false;
function drawHeartbeat() {
  const line = document.getElementById('hbLine');
  if (!line) return;
  const max = Math.max(1, ...hbPoints);
  const min = Math.min(...hbPoints);
  const span = max - min;
  line.setAttribute('points', hbPoints.map((v, i) => {
    const x = (i * 72) / (HB_LEN - 1);
    const y = span ? 16 - ((v - min) / span) * 13 : 9;
    return `${x.toFixed(2)},${y.toFixed(2)}`;
  }).join(' '));
}
function sampleHeartbeat() {
  if (!state.loaded) return;
  const n = state.data.sessions.filter((s) => ACTIVE.has(s.status)).length;
  if (!hbReady) {
    for (let i = 0; i < HB_LEN; i++) hbPoints.push(n);
    hbReady = true;
  } else {
    hbPoints.push(n);
    if (hbPoints.length > HB_LEN) hbPoints.shift();
  }
  drawHeartbeat();
}
setInterval(sampleHeartbeat, 10000);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function dur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${String(m % 60).padStart(2, '0')}m`;
}

function ago(t, now) {
  const s = Math.round((t - now) / 1000);
  if (s > -45) return rtf.format(0, 'second');
  const m = Math.round(s / 60);
  if (m > -60) return rtf.format(m, 'minute');
  const h = Math.round(m / 60);
  if (h > -24) return rtf.format(h, 'hour');
  return rtf.format(Math.round(h / 24), 'day');
}

// Single-quote for POSIX shells: inside '…' nothing ($(), backticks, $VAR)
// is expanded, so a folder or session name can't run anything when pasted.
const shq = (v) => `'${String(v).replace(/'/g, `'\\''`)}'`;
function resumeCmd(s) {
  if (s.source === 'magpie') return '';
  if (s.agent === 'omp') return s.resumeCommand || '';
  const cd = s.cwd ? `cd ${shq(s.cwd)} && ` : '';
  if (s.agent === 'claude') return `${cd}claude --resume ${shq(s.id)}`;
  if (s.agent === 'gemini') return `${cd}gemini --resume ${shq(s.sessionId || s.id)}`;
  if (s.agent === 'copilot') return `${cd}copilot --resume ${shq(s.sessionId || s.id)}`;
  if (s.agent === 'antigravity') return `${cd}agy --conversation ${shq(s.id)}`;
  if (s.agent === 'kimi') return `${cd}kimi --session ${shq(s.sessionId || s.id)}`;
  if (s.agent === 'dsh') return `${cd}dsh tui --resume ${shq(s.id)}`;
  if (s.agent === 'grok') return `${cd}grok --resume ${shq(s.id)}`;
  if (s.agent === 'pi') return `${cd}pi --session ${shq(s.sessionId || s.id)}`;
  if (s.agent === 'opencode') return `${cd}opencode --session ${shq(s.id)}`;
  if (s.agent === 'hermes') return `${cd}hermes --resume ${shq(s.id)}`;
  if (s.agent === 'deepseek') return s.sessionId ? `${cd}claude --resume ${shq(s.sessionId)}` : '';
  return s.agent === 'codex' ? `${cd}codex resume ${shq(s.id)}` : '';
}

function agentLogo(agent) {
  const badge = OFFICE_AGENT_BADGES[agent];
  return badge ? `<img class="agent-logo${badge.mono ? ' mono' : ''}" src="${badge.logo}" alt="" aria-hidden="true">` : '';
}


function fmtTokens(n) {
  if (n < 1000) return String(n);
  if (n < 1e6) return `${(n / 1e3).toFixed(n < 1e4 ? 1 : 0)}k`;
  return `${(n / 1e6).toFixed(n < 1e7 ? 2 : 1)}M`;
}

function renderToday() {
  const t = state.data.summary;
  document.getElementById('todayTokens').textContent = t && t.tokens ? fmtTokens(t.tokens) : '';
  const panel = document.getElementById('todayPanel');
  if (!t || !t.agents) { panel.innerHTML = `<div class="today-note">${esc(L.noUsage)}</div>`; return; }
  const agents = Object.entries(t.byAgent).sort((a, b) => b[1].turns - a[1].turns || b[1].tokens - a[1].tokens);
  const projects = Object.entries(t.projects).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);
  panel.innerHTML = `
    <div class="today-big">
      <div><b class="ui-num">${t.turns}</b><span>${esc(L.turnsL)}</span></div>
      <div><b class="ui-num">${fmtTokens(t.tokens)}</b><span>${esc(L.tokensL)}</span></div>
      <div><b class="ui-num">${t.agents}</b><span>${esc(L.agentsL)}</span></div>
    </div>
    ${agents.map(([a, v]) => `<div class="today-row">${agentLogo(a)}${esc(AGENT_NAME[a] || a)}<span class="n ui-num">${v.turns} ${esc(L.turnsL)} · ${fmtTokens(v.tokens)}</span></div>`).join('')}
    ${projects.length ? `<div class="today-head">${esc(L.topProjects)}</div>` : ''}
    ${projects.map(([p, n]) => `<div class="today-row">${esc(p)}<span class="n ui-num">${n} ${esc(L.turnsL)}</span></div>`).join('')}
    <div class="today-note">${esc(L.summaryNote)}</div>`;
}

const matchAgent = (s) => !state.agents.length || state.agents.includes(s.agent);
function visible() {
  const list = state.data.sessions.filter((s) =>
    matchAgent(s) && (state.showSub || !s.subagent));
  const shown = list.filter((s) => state.showIdle || s.status !== 'idle');
  if (state.showIdle) return shown;
  // An idle controller still anchors the children that are visible (a child
  // waiting on you, for example); keep it in the list so the group survives.
  const keep = new Set(shown.map((s) => s.key));
  const byRef = new Map();
  for (const s of list) {
    if (s.id) byRef.set(String(s.id), s);
    if (s.sessionId) byRef.set(String(s.sessionId), s);
  }
  for (const s of shown) {
    let p = s.parentId ? byRef.get(String(s.parentId)) : null;
    for (let guard = 0; p && guard < 32; guard++) {
      keep.add(p.key);
      p = p.parentId ? byRef.get(String(p.parentId)) : null;
    }
  }
  return list.filter((s) => keep.has(s.key));
}

function reducedMotion() {
  try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; }
}

// Top-bar counts roll digit by digit: each digit is a one-line window holding
// the old value above the new one, and the strip slides up 300ms.
function rollNumber(el, value) {
  if (!el) return;
  const next = String(value);
  const prev = el.dataset.roll != null ? el.dataset.roll : el.textContent.trim();
  el.dataset.roll = next;
  if (prev === next) return;
  if (reducedMotion() || prev.length > 3 || next.length > 3) {
    el.textContent = next;
    return;
  }
  const oldDigits = Array.from(prev);
  const newDigits = Array.from(next);
  const len = Math.max(oldDigits.length, newDigits.length);
  const frag = document.createDocumentFragment();
  const strips = [];
  for (let i = 0; i < len; i++) {
    const cell = document.createElement('span');
    cell.className = 'ui-roll-d';
    const strip = document.createElement('span');
    strip.className = 'ui-roll-s';
    const a = document.createElement('span');
    a.textContent = oldDigits[i] ?? '';
    const b = document.createElement('span');
    b.textContent = newDigits[i] ?? '';
    strip.append(a, b);
    cell.append(strip);
    frag.append(cell);
    strips.push(strip);
  }
  el.textContent = '';
  el.append(frag);
  void el.offsetWidth;
  for (const strip of strips) strip.style.transform = 'translateY(-1em)';
  clearTimeout(el._rollT);
  el._rollT = setTimeout(() => { el.textContent = next; }, 320);
}

function render() {
  const now = Date.now() - state.skew;
  const all = state.data.sessions.filter((s) => matchAgent(s) && (state.showSub || !s.subagent));

  const count = (f) => all.filter((s) => f(s.status)).length;
  const needs = count((s) => s === 'waiting');
  const errors = count((s) => s === 'error');
  const working = count((s) => ACTIVE.has(s));
  const finished = count((s) => s === 'done' || s === 'interrupted');
  const setCount = (id, n) => rollNumber(document.getElementById(id), n);
  setCount('cntNeeds', needs);
  setCount('cntError', errors);
  setCount('cntWorking', working);
  setCount('cntFinished', finished);
  const errBtn = document.getElementById('btnError');
  if (errBtn) errBtn.hidden = errors === 0;
  const errSep = document.getElementById('sepError');
  if (errSep) errSep.hidden = errors === 0;

  renderToday();
  renderChips();
  document.title = (needs ? '● ' : '') + (working ? `(${working}) ` : '') + tr('brand');

  const main = document.getElementById('main');
  const active = state.view;
  const officeMode = active === 'office';
  window.Topo?.setActive?.(active === 'topo');
  window.AgentDrawer?.setView?.(active);
  // The office decides who sits at a desk and who wanders around.
  const officeList = all;
  const poppedOut = !!popout?.win;
  // Wait for the first snapshot so people start at their places instead of
  // all walking in through the door.
  if (office && state.loaded) {
    office.showAgent = state.showAgent;
    const on = officeMode && !poppedOut;
    office.setVisible(on);
    if (on) office.resume?.(); else office.pause?.();
    office.update(officeList);
  }
  const agents = new Set(officeList.map(s => s.agent));
  const legend = document.getElementById('agentLegend');
  const labels = Object.keys(OFFICE_AGENT_BADGES).filter(agent => agents.has(agent))
    .map(agent => `<span>${agentLogo(agent)}${esc(AGENT_NAME[agent])}</span>`).join('');
  if (legend.innerHTML !== labels) legend.innerHTML = labels;
  legend.hidden = !state.showAgent || !labels;
  document.getElementById('idleToggle').style.display = officeMode && !state.full ? 'none' : '';
  if (poppedOut) {
    document.getElementById('officeWrap').style.display = 'none';
    if (state.full) {
      const empty = document.getElementById('officeEmpty');
      if (empty) { empty.hidden = false; empty.innerHTML = `<div class="empty">${esc(L.pipOn)}</div>`; }
    } else {
      main.innerHTML = `<div class="empty">${esc(L.pipOn)}</div>`;
    }
    return;
  }
  const officeEmpty = document.getElementById('officeEmpty');
  if (officeEmpty) officeEmpty.hidden = true;
  if (officeMode) {
    if (officeEmpty && !officeList.length) {
      officeEmpty.hidden = false;
      officeEmpty.innerHTML = `<div class="empty">${esc(L.empty)}</div>`;
    }
    document.getElementById('officeWrap').style.display = officeList.length || state.full ? '' : 'none';
    if (!state.full) main.innerHTML = officeList.length ? '' : `<div class="empty">${esc(L.empty)}</div>`;
    window.AgentDrawer?.render?.();
    return;
  }
  if (active === 'workbench') {
    if (!state.full) main.innerHTML = '';
    window.Workbench?.render?.();
    return;
  }
  if (active === 'timeline') {
    if (!state.full) main.innerHTML = '';
    window.Timeline?.render?.();
    return;
  }
  if (active === 'topo') {
    if (!state.full) main.innerHTML = '';
    window.Topo?.render?.();
    window.AgentDrawer?.render?.();
  }
}


function onData(data) {
  for (const s of data.sessions) {
    if (!validAgentId(s.agent)) continue;
    if (!Object.hasOwn(AGENT_NAME, s.agent)) AGENT_NAME[s.agent] = s.agentName || s.agent;
  }
  state.skew = Date.now() - data.now;
  const first = state.prev.size === 0;
  state.flash.clear();
  for (const s of data.sessions) {
    const before = state.prev.get(s.key);
    const wasStuck = state.prevStuck.has(s.key);
    const needsYou = s.status === 'waiting' || s.status === 'error';
    let alert = null;
    if (!first && before && before !== s.status && (needsYou || (s.status === 'done' && ACTIVE.has(before)))) {

  return fetch('/api/scenes').then((r) => r.json()).then((d) => {
    state.scenes = d.installed || [];
    state.available = d.available || [];
    renderSceneSel();
  }).catch(() => {});
}
sceneSel.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b || b.classList.contains('on') || sceneSel.dataset.busy) return;
  let id = b.dataset.v;
  if (id.startsWith('dl:')) {
    // A scene pack: download it (the server checks its checksum), then switch.
    id = id.slice(3);
    sceneSel.dataset.busy = '1';
    setLoading(true, L.installing);
    const r = await fetch(`/api/scenes/install?id=${encodeURIComponent(id)}`, { method: 'POST', headers: { 'x-whatsmyagentdoing': 'install' } })
      .then((x) => x.json()).catch(() => ({ ok: false }));
    await loadScenes();
    delete sceneSel.dataset.busy;
    if (!r.ok) { setLoading(true, L.installFailed); setTimeout(() => setLoading(false), 2000); renderSceneSel(); return; }
  }
  state.scene = id; store.set('scene', id); renderSceneSel(); makeOffice();
  closeMenus();
});
// Know the installed scenes before building the first office, so a saved
// scene choice doesn't build the default office first and then swap.
const scenesReady = loadScenes();

// ---- version (local only; this fork never checks upstream)
let verInfo = null;
function renderVersion() {
  const about = document.getElementById('aboutVer');
  if (about) about.textContent = verInfo ? `v${verInfo.version}` : '';
  const note = document.getElementById('aboutNote');
  const fork = verInfo ? tr('aboutFork') : null;
  if (note) note.textContent = typeof fork === 'function' ? fork(verInfo.version) : '';
}
function loadVersion() {
  fetch('/api/version', { cache: 'no-store' }).then((r) => r.json()).then((v) => { verInfo = v; renderVersion(); }).catch(() => {});
}
loadVersion();

// Language: Auto plus the nine translations, as a compact select in settings.
function renderLangMenu() {
  const pick = store.get('lang', 'auto');
  const sel = document.getElementById('langSelect');
  if (!sel) return;
  const autoName = I18N[chooseLangAuto()]?.langName || '';
  sel.innerHTML = `<option value="auto">${esc(L.auto)}${autoName ? ` · ${esc(autoName)}` : ''}</option>` +
    Object.entries(I18N).map(([k, v]) => `<option value="${esc(k)}">${esc(v.langName)}</option>`).join('');
  sel.value = pick;
}
function chooseLangAuto() { return (state.data.lang && I18N[state.data.lang] ? state.data.lang : i18nFromBrowser(navigator.languages || [navigator.language])) || 'en'; }
document.getElementById('langSelect').addEventListener('change', (e) => {
  store.set('lang', e.target.value); state.lang = e.target.value;
  applyLang(chooseLang(state.data.lang));
  renderLangMenu(); render();
  closeMenus();
});
popout = new OfficePopout({
  preferences: () => ({ ...Object.fromEntries(Object.keys(PREF_DEFAULTS).map((k) => [k, state[k]])), lang: store.get('lang', 'auto') }),
  office: () => office,
  text: (key) => L[key],
  changed: () => { syncControls(); render(); },
});
// Both windows share preferences; keep filters, language, scene and badges in
// sync even when changes come from the compact window or another open tab.
window.addEventListener('storage', (e) => {
  if (e.key !== null && !Object.keys(PREF_DEFAULTS).some((k) => e.key === 'wmad.' + k)) return;
  Object.assign(state, readPreferences());
  applyTheme();
  renderLangMenu();
  applyLang(chooseLang(state.data.lang));
  syncControls();
  renderSceneSel();
  makeOffice();
  render();
});
applyLang(chooseLang(null));
syncControls();
// A fresh load starts at the office unless the URL names a screen; the old
// localStorage view key is deliberately ignored.
history.scrollRestoration = 'manual';
{
  const initial = SCREENS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'office';
  navLock = Date.now() + 500;
  setActiveScreen(initial);
  requestAnimationFrame(() => {

function statusColor(st) {
  return {
    thinking: 'var(--st-thinking)', tool: 'var(--st-tool)', typing: 'var(--st-typing)',
    waiting: 'var(--st-waiting)', directing: 'var(--st-directing)', done: 'var(--st-done)', error: 'var(--st-error)',
    interrupted: 'var(--st-interrupted)', idle: 'var(--st-interrupted)',
  }[st] || 'var(--faint)';
}
function hhmm(ms) {
  if (!ms) return '';
  return new Date(ms).toLocaleTimeString(langCode || undefined, { hour: '2-digit', minute: '2-digit' });
}
function measureBar() {
  const h = document.querySelector('header').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--bar', `${Math.round(h)}px`);
}

// Agent filter: one chip per client in use, any number selected; none means all.
function renderChips() {
  const pool = state.data.sessions.filter((s) => (state.showSub || !s.subagent) && (state.showIdle || s.status !== 'idle'));
  const count = new Map();
  for (const s of pool) count.set(s.agent, (count.get(s.agent) || 0) + 1);
  const order = Object.keys(OFFICE_AGENT_BADGES);
  const agents = [...new Set([...count.keys(), ...state.agents])]
    .sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99) || a.localeCompare(b));
  const all = !state.agents.length;
  const row = (v, icon, name, n, on) => `<button class="chip-f${on ? ' on' : ''}" data-v="${esc(v)}" aria-pressed="${on}" title="${esc(name)}">` +
    `<span class="box">${CHECK}</span>${icon}<span class="lbl">${esc(name)}</span><b>${n}</b></button>`;
  const html = row('all', '', L.all, pool.length, all) + agents.map((a) => {
    const logo = agentLogo(a) || `<span class="ini">${esc((AGENT_NAME[a] || a).slice(0, 2))}</span>`;
    return row(a, logo, AGENT_NAME[a] || a, count.get(a) || 0, !all && state.agents.includes(a));
  }).join('');
  const box = document.getElementById('agentChips');
  if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html; }
  // The label says what is shown: All, one or two names, or how many.
  const names = state.agents.map((a) => AGENT_NAME[a] || a);
  const nameEl = document.getElementById('agentName');
  if (nameEl) nameEl.textContent = all ? L.all : names.length <= 2 ? names.join(', ') : `${names.length}`;
  document.getElementById('agentMenu')?.classList.toggle('active', !all);
}
document.getElementById('agentChips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip-f'); if (!b) return;
  const v = b.dataset.v;
  let next = v === 'all' ? [] : state.agents.includes(v) ? state.agents.filter((x) => x !== v) : [...state.agents, v];
  // Every client picked is the same as all of them.
  const present = new Set(state.data.sessions.map((s) => s.agent));
  if (next.length && [...present].every((a) => next.includes(a))) next = [];
  state.agents = next; store.set('agents', next);
  syncControls(); renderNow();
});

// Set when the person changes a filter: the list follows at once even under the pointer.
let rowsNow = false;
function renderNow() { rowsNow = true; try { render(); } finally { rowsNow = false; } }

addEventListener('resize', measureBar);
if (state.full) {
  document.body.classList.add('full');
  requestAnimationFrame(measureBar);
}

// ---- image lightbox: thumbnails from the run log open full size
const lightbox = document.getElementById('lightbox');
let lbList = [];
let lbIdx = 0;
function lbShow(i) {
  if (!lbList.length) return;
  lbIdx = (i + lbList.length) % lbList.length;
  const b = lbList[lbIdx];
  lightbox.querySelector('img').src = b.dataset.shot;
  const cap = b.dataset.cap || '';
  lightbox.querySelector('.cap').textContent = lbList.length > 1 ? `${cap} · ${lbIdx + 1}/${lbList.length}` : cap;
  lightbox.classList.toggle('single', lbList.length < 2);
}
function lbOpen(b) {
  const group = b.closest('.as-grid, .dt-imgrid, .dt-shots');
  lbList = group ? [...group.querySelectorAll('[data-shot]')] : [b];
  lbShow(lbList.indexOf(b));
  lightbox.classList.add('on');
}
function lbClose() {
  lightbox.classList.remove('on');
  lightbox.querySelector('img').src = '';
  lbList = [];
}
document.addEventListener('click', (e) => {
  const nav = e.target.closest('.lb-nav');
  if (nav) {
    lbShow(lbIdx + (nav.classList.contains('lb-prev') ? -1 : 1));
    return;
  }
  const b = e.target.closest('[data-shot]');
  if (b) {
    lbOpen(b);
    return;
  }
  if (lightbox.classList.contains('on') && (e.target === lightbox || e.target.closest('#lightbox'))) {
    lbClose();
  }
});
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('on')) return;
  if (e.key === 'Escape') lbClose();
  else if (e.key === 'ArrowLeft') lbShow(lbIdx - 1);
  else if (e.key === 'ArrowRight') lbShow(lbIdx + 1);
});
