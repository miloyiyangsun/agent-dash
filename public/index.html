<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's my agent doing</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👀</text></svg>">
<style>
  /* Colour tokens live in /ui/tokens.css; theme.css keeps the legacy aliases. */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 24px; margin-bottom: 16px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--ink); font-weight: 600; }
  .summary { display: flex; gap: 18px; flex-wrap: wrap; margin-left: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 0; font-size: 12px; color: var(--muted); }
  .chip b { color: var(--ink); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .controls { position: relative; width: 100%; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
  .seg button { border: 0; background: none; color: var(--muted); padding: 5px 12px; border-radius: 5px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .seg button:hover:not(.on) { color: var(--ink); background: var(--bg); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .seg button small { opacity: .65; font-size: 11px; }
  label.tog { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 5px 11px; border-radius: 8px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .btn:hover { color: var(--ink); border-color: var(--faint); }
  button:focus-visible, select:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--tool); outline-offset: 3px; }
  .toolbar-space { flex: 1; }
  .controls > .btn, .settings > summary { min-height: 36px; display: inline-flex; align-items: center; white-space: nowrap; }
  .settings > summary { list-style: none; gap: 7px; color: var(--ink); }
  .settings > summary::-webkit-details-marker { display: none; }
  /* A drawn chevron sits on the text's centre line; the ⌄ glyph hangs below it in most fonts. */
  .settings > summary::after { content: ""; flex: none; width: 6px; height: 6px; margin: -3px 1px 0 2px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(45deg); transition: transform .2s ease, margin .2s ease; }
  .settings[open] > summary { background: var(--line); }
  .settings[open] > summary::after { margin-top: 3px; transform: rotate(-135deg); }
  .filter-active { font-size: 11px; color: var(--tool); }
  .settings-panel { position: absolute; z-index: 20; right: 0; top: calc(100% + 10px); width: min(360px, calc(100vw - 32px)); max-height: calc(100dvh - 180px); overflow-y: auto; overscroll-behavior: contain; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow-float); }
  .setting-group + .setting-group { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .setting-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 9px; }
  .setting-toggles { display: grid; gap: 12px; margin-top: 14px; }
  .setting-toggles .tog { color: var(--ink); gap: 8px; }
  .tog input { accent-color: var(--tool); margin: 0; width: 15px; height: 15px; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .setting-row .setting-label { margin: 0; }
  @media (max-width: 640px) {
    header { gap: 14px; }
    .summary { margin-left: 0; width: 100%; gap: 18px; }
    .controls { gap: 6px; padding-top: 12px; }
    .seg button { padding-inline: 9px; }
    .controls > .btn, .settings > summary { padding-inline: 9px; }
  }
  @media (max-width: 360px) {
    body { padding-inline: 10px; }
    .controls { gap: 4px; }
    .seg button { padding-inline: 7px; }
  }

  section { margin-top: 26px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  section h2 .n { color: var(--faint); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .controls { margin-left: 0; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; transition: border-color .3s; }
  .card.sub { padding: 10px 12px; gap: 6px; }
  .card.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--done); } 100% { box-shadow: var(--shadow); } }
  .card[data-s="waiting"], .card[data-s="error"] { border-color: color-mix(in srgb, var(--s) 55%, var(--line)); }
  .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .agent { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--muted); flex: none; }
  .agent-logo { width: 20px; height: 20px; object-fit: contain; padding: 1px; flex: none; }
  @media (prefers-color-scheme: dark) {
    .agent-logo.mono { filter: invert(1); }
  }
  .project { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .time { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .title { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--s); font-weight: 600; font-size: 13px; min-width: 0; }
  .status .lbl { white-space: nowrap; flex: none; }
  .status .act { flex: 1 1 auto; color: var(--ink); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-family: var(--font-mono); font-size: 12px; }
  .q, .r { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .q::before { content: "› "; color: var(--faint); }
  .r { color: var(--ink); opacity: .85; }
  .r::before { content: "← "; color: var(--faint); }
  .err { font-size: 12.5px; color: var(--error); }
  .today-tokens { color: var(--muted); font-variant-numeric: tabular-nums; }
  .today-panel { width: min(340px, calc(100vw - 32px)); }
  .today-big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .today-big div { padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .today-big b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .today-big span, .today-note, .today-head { font-size: 12px; color: var(--muted); }
  .today-head { margin: 12px 0 6px; font-weight: 600; }
  .today-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
  .today-row .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .today-note { margin-top: 12px; line-height: 1.5; }
  .ctx { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--faint); }
  .ctx .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .ctx .bar i { display: block; height: 100%; border-radius: 2px; background: var(--st-done); }
  .ctx.warn .bar i { background: var(--st-waiting); }
  .ctx.full .bar i { background: var(--st-error); }
  /* ---- toolbar menus and controls, styled to match (no browser defaults) */
  details.menu > summary { gap: 7px; }
  .scene-ico { display: inline-flex; }
  .scene-art { width: 18px; height: 18px; flex: none; display: block; object-fit: contain; }
  .scene-list .thumb .scene-art { width: 22px; height: 22px; }
  #sceneName, #langName { max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Scene, agent and language menus share one compact list. */
  .list-panel { width: 250px; padding: 12px; }
  .scene-panel { right: auto; left: 0; }
  .pick-list { display: flex; flex-direction: column; gap: 1px; margin-top: 8px; }
  .pick-list button { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 34px; padding: 6px 8px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; }
  .pick-list button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .pick-list .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick-list small { color: var(--faint); font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }
  .pick-list .chk { flex: none; opacity: 0; color: var(--tool); }
  .pick-list button.on { font-weight: 600; }
  .pick-list button.on .chk { opacity: 1; }
  .pick-list .agent-logo { width: 16px; height: 16px; margin: 0; }
  .scene-list .thumb { flex: none; width: 44px; height: 28px; border-radius: 5px; overflow: hidden; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 7%, var(--panel)); color: var(--muted); }
  .scene-list .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Agent rows: a checkbox square, the logo, the name and a count */
  #agentChips .box { flex: none; display: grid; place-items: center; width: 16px; height: 16px; border: 1.5px solid color-mix(in srgb, var(--ink) 30%, var(--line)); border-radius: 4px; }
  #agentChips .box .chk { width: 12px; height: 12px; opacity: 0; color: var(--on-accent); stroke-width: 2.6; }
  #agentChips .on .box { background: var(--tool); border-color: var(--tool); }
  #agentChips .on .box .chk { opacity: 1; }
  #agentChips .chip-f > .chk, #agentChips button > svg.chk:last-child { display: none; }
  #agentChips b { font-weight: 500; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  #agentChips .ini { font-size: 11px; color: var(--muted); width: 16px; text-align: center; }
  details.menu.active > summary { border-color: color-mix(in srgb, var(--tool) 55%, var(--line)); }
  .prefs-panel { width: 280px; }
  .prefs-panel .setting-toggles { display: flex; flex-direction: column; gap: 2px; margin: 0 0 12px; }
  /* Switches instead of checkboxes */
  .prefs-panel label.tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 2px; font-size: 13.5px; color: var(--ink); cursor: pointer; }
  .tog input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 36px; height: 21px; margin: 0; border-radius: 999px; background: color-mix(in srgb, var(--ink) 18%, var(--panel)); cursor: pointer; transition: background .18s; }
  .tog input::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 16px; height: 16px; border-radius: 50%; background: var(--knob); box-shadow: var(--shadow-knob); transition: transform .18s cubic-bezier(.2, .8, .2, 1); }
  .tog input:checked { background: var(--tool); }
  .tog input:checked::after { transform: translateX(15px); }
  .tog input:focus-visible { outline: 2px solid var(--tool); outline-offset: 2px; }
  .tog-note { margin: 0 2px 4px; font-size: 12px; line-height: 1.5; color: var(--muted); }
  .prefs-panel .setting-toggles:last-of-type { margin-bottom: 4px; }
  /* ---- full-screen mode: the office fills the window, agents in a side panel */
  .ui-ico { stroke-width: 1.8; }
  .side, .side-tab { display: none; }
  body.full { overflow: hidden; padding: 0; margin: 0; height: 100dvh; }
  body.full .wrap { max-width: none; height: 100dvh; padding: 0; display: flex; flex-direction: column; }
  body.full header { flex-wrap: wrap; gap: 8px 14px; margin: 0; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  body.full h1 { font-size: 15px; white-space: nowrap; }
  body.full .summary { margin-left: 0; flex-wrap: nowrap; }
  body.full .controls { width: auto; flex: 1; min-width: 0; padding: 0; border: 0; flex-wrap: wrap; row-gap: 6px; }
  /* The panel floats over a full-width office; the office pans its view to keep
     the room clear of it (setInset), so the canvas never resizes during the slide. */
  body.full #officeWrap { position: relative; flex: 1; min-height: 0; }
  body.full .office { height: 100%; min-height: 0; border: 0; border-radius: 0; }
  body.full .legend { position: absolute; left: 12px; bottom: 10px; margin: 0; padding: 6px 10px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(6px); }
  body.full #agentLegend { bottom: 44px; }
  body.full #main { display: none; }
  /* The video pop-out preview and its errors float over the office instead of pushing it down. */
  body.full .pip-preview { position: fixed; z-index: 25; left: 16px; bottom: 84px; width: min(360px, calc(100vw - 32px)); margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow-float); }
  body.full .pip-preview video { width: 100%; height: auto; border-radius: 8px; }
  body.full .pip-preview p { margin: 0 0 8px; font-size: 12px; }
  body.full .pip-error { position: fixed; z-index: 25; left: 50%; top: calc(var(--bar, 53px) + 12px); transform: translateX(-50%); margin: 0; padding: 8px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-float); }
  body.full .side { display: block; position: fixed; z-index: 15; right: 0; bottom: 0; top: var(--bar, 53px); width: 340px; border-left: 1px solid var(--line); background: var(--panel); transition: transform .32s cubic-bezier(.2, .8, .2, 1), box-shadow .32s; overflow: hidden; }
  body.full.side-closed { --side: 0px; }
  body.full.side-closed .side { transform: translateX(100%); box-shadow: none; }
  body.full.side-closed .side-tab { display: inline-flex; animation: tabIn .3s .18s both cubic-bezier(.2, .8, .2, 1); }
  @keyframes tabIn { from { opacity: 0; transform: translateX(12px); } }
  .side-tab { position: fixed; z-index: 15; right: 12px; top: calc(var(--bar, 53px) + 12px); align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); font: 600 13px inherit; cursor: pointer; box-shadow: var(--shadow-float); }
  .side-pane { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--panel); transition: transform .34s cubic-bezier(.2, .8, .2, 1), opacity .34s; }
  /* Layer two slides in over the list; the list eases left and fades. */
  #sideDetail { transform: translateX(100%); }
  .side.detail #sideDetail { transform: none; }
  .side.detail #sideList { transform: translateX(-22%); opacity: 0; }
  .side.opening .srow, .side.entering #detailBody > * { animation: rowIn .38s both cubic-bezier(.2, .8, .2, 1); animation-delay: calc(var(--i, 0) * 28ms + 80ms); }
  .side.entering #detailBody > * { animation-delay: 140ms; }
  @keyframes rowIn { from { opacity: 0; transform: translateX(14px); } }
  @media (prefers-reduced-motion: reduce) {
    .side, .side-pane { transition: none; }
    .side.opening .srow, .side.entering #detailBody > *, body.full.side-closed .side-tab { animation: none; }
  }
  .side-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  #detailTitle { display: flex; align-items: center; gap: 7px; }
  .side-head b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-count { color: var(--muted); font-size: 12px; }
  .icon-btn { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
  .icon-btn:hover { color: var(--ink); }
  .side-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 8px 10px 16px; }
  .side-group { margin: 10px 6px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .srow { width: 100%; display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 9px; align-items: center; text-align: left; padding: 9px 10px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: inherit; cursor: pointer; }
  .srow:hover, .srow:focus-visible { background: color-mix(in srgb, var(--ink) 6%, transparent); outline: none; }
  .srow .agent-logo { width: 16px; height: 16px; margin: 0; }
  .srow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 600; }
  .srow .tm { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .srow .st { grid-column: 2 / 4; display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; color: var(--muted); }
  .srow .st i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--s); }
  .srow .st span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .st b { flex: none; color: var(--s); font-weight: 600; }
  .srow.sub .nm { font-weight: 500; color: var(--muted); }
  .dmeta { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 10px 6px 12px; font-size: 12.5px; }
  .dmeta dt { color: var(--faint); }
  .dmeta dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dmeta dd.mono { font-family: var(--font-mono); font-size: 11.5px; }
  .dstatus { display: flex; align-items: center; gap: 7px; margin: 8px 6px 0; font-size: 13px; flex-wrap: wrap; }
  .dstatus i { width: 8px; height: 8px; border-radius: 50%; background: var(--s); }
  .dstatus b { color: var(--s); }
  .dstatus .act { color: var(--muted); }
  .dtitle { margin: 4px 6px 0; font-size: 13px; color: var(--muted); }
  .dactions { display: flex; gap: 8px; margin: 0 6px 6px; }
  .dactions .copy { font-size: 12px; }
  .side .ctx { margin: 0 6px 10px; }
  .msgs { display: flex; flex-direction: column; gap: 8px; margin: 6px 4px 0; }
  .msg { max-width: 92%; padding: 8px 11px; border-radius: 12px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: color-mix(in srgb, var(--tool) 16%, var(--panel)); }
  .msg.assistant { align-self: flex-start; background: color-mix(in srgb, var(--ink) 6%, var(--panel)); border: 1px solid var(--line); }
  .msg.tool { align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 3px 4px; color: var(--muted); font: 11.5px var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .msg .at { display: block; margin-top: 3px; font-size: 10.5px; color: var(--faint); }
  .msgs-note { margin: 12px 6px; font-size: 12.5px; color: var(--muted); }
  .side-sec { margin: 14px 6px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  /* The panel's group headings already count Needs you / Working / Finished, so the
     toolbar drops those chips (and then the title) before it would wrap. */
  @media (max-width: 1240px) { body.full .summary { display: none; } }
  @media (max-width: 900px) {
    body.full h1, body.full #langName, body.full .today-tokens,
    body.full #todayMenu > summary [data-t], body.full #settingsMenu > summary [data-t] { display: none; }
  }
  /* Phones: one row of icon buttons; the labels, chevrons and pop-out (unsupported there) go. */
  @media (max-width: 640px) {
    html body.full header { padding: 8px 10px; gap: 6px; flex-wrap: nowrap; }
    html body.full .controls { flex-wrap: nowrap; gap: 6px; }
    body.full details.menu > summary { gap: 0; padding-inline: 9px; }
    body.full #sceneMenu > summary { gap: 6px; }
    body.full #sceneName { max-width: 6.5em; }
    body.full details.menu > summary::after,
    body.full #agentName, body.full #langName, body.full .today-tokens,
    body.full #todayMenu > summary [data-t], body.full #settingsMenu > summary [data-t] { display: none; }
    body.full details.menu.active > summary { position: relative; }
    body.full details.menu.active > summary::before { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--tool); }
  }
  @media (max-width: 359px) { body.full #sceneName { display: none; } }
  @media (max-width: 760px) {
    body.full .side { width: min(340px, 88vw); }
    body.full h1, body.full .summary { display: none; }
    body.full header { flex-wrap: wrap; }
    /* Menus span the screen under the toolbar instead of hanging off their button. */
    body.full .settings-panel { position: fixed; left: auto; right: 12px; max-width: calc(100vw - 24px); top: calc(var(--bar, 53px) + 6px); max-height: calc(100dvh - var(--bar, 53px) - 24px); }
    body.full .controls { flex-wrap: wrap; row-gap: 6px; }
  }
  .stuck { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--error); white-space: nowrap; }
  .ui-ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .card.is-stuck { border-color: color-mix(in srgb, var(--error) 45%, var(--line)); }
  .foot { display: flex; gap: 8px; align-items: center; color: var(--faint); font-size: 11.5px; min-width: 0; }
  .foot .model { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .copy { margin-left: auto; border: 0; background: none; color: var(--faint); font: inherit; font-size: 11.5px; cursor: pointer; padding: 0; flex: none; }
  .copy:hover { color: var(--ink); }

  [data-s="thinking"] { --s: var(--st-thinking); }
  [data-s="tool"] { --s: var(--st-tool); }
  [data-s="typing"] { --s: var(--st-typing); }
  [data-s="waiting"] { --s: var(--st-waiting); }
  [data-s="done"] { --s: var(--st-done); }
  [data-s="interrupted"] { --s: var(--st-interrupted); }
  [data-s="error"] { --s: var(--st-error); }
  [data-s="idle"] { --s: var(--st-interrupted); }

  .ind { width: 18px; height: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; flex: none; }
  .ind i { width: 4px; height: 4px; border-radius: 50%; background: var(--s); display: none; }
  [data-s="thinking"] .ind i { display: block; }
  [data-s="thinking"] .ind i { animation: bob 1.2s infinite ease-in-out; }
  [data-s="thinking"] .ind i:nth-child(2) { animation-delay: .15s; }
  [data-s="thinking"] .ind i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  [data-s="tool"] .ind::before { content: ""; width: 11px; height: 11px; border: 2px solid var(--s); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [data-s="typing"] .ind::before { content: ""; width: 2px; height: 13px; background: var(--s); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  [data-s="waiting"] .ind::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--s); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--s) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
  [data-s="done"] .ind::before { content: "✓"; color: var(--s); font-weight: 700; }
  [data-s="error"] .ind::before { content: "!"; color: var(--s); font-weight: 800; }
  [data-s="interrupted"] .ind::before { content: "■"; color: var(--s); font-size: 9px; }
  [data-s="idle"] .ind::before { content: "–"; color: var(--s); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .office { position: relative; height: min(74vh, 820px); min-height: 380px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
  .office-canvas { display: block; }
  .office canvas { transition: opacity .35s; }
  .office.loading canvas { opacity: 0; }
  .office-loader { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 13px; z-index: 2; }
  .office.loading .office-loader { display: flex; }
  .office-loader .spin { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--tool); border-radius: 50%; animation: spin .8s linear infinite; }
  .office-gl, .office-overlay { position: absolute; inset: 0; }
  .office-overlay { touch-action: none; }
  .tip { position: fixed; z-index: 10; width: 320px; max-width: calc(100vw - 24px); pointer-events: none; display: none; }
  .tip.pinned { pointer-events: auto; }
  .tip .card { box-shadow: var(--shadow-float); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  .pip-preview { margin-bottom: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .pip-preview p { margin: 0 0 10px; color: var(--muted); }
  .pip-preview video { display: block; width: min(100%, 520px); margin-bottom: 10px; background: var(--panel); }
  .pip-error { color: var(--error); margin: 0 0 12px; }
  .newver { border: 1px solid var(--tool); background: color-mix(in srgb, var(--tool) 18%, var(--panel)); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; animation: glowv 2.4s ease-in-out infinite; }
  .newver:disabled { opacity: .7; cursor: default; animation: none; }
  @keyframes glowv { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--tool) 25%, transparent); } }
  .ver { position: fixed; right: 14px; bottom: 12px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--faint); z-index: 5; }
  .ver button { border: 1px solid var(--tool); background: color-mix(in srgb, var(--tool) 14%, var(--panel)); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .ver button:disabled { opacity: .6; cursor: default; }
  .ver code { background: var(--panel); border: 1px solid var(--line); padding: 2px 6px; border-radius: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 16px; border: 1px dashed var(--line); border-radius: 12px; }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 4px; }
  .conn { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--error); color: var(--on-accent); padding: 6px 14px; border-radius: 999px; font-size: 12.5px; display: none; }
  .conn.on { display: block; }

  /* The PiP iframe owns its animation clock, layout, and pointer events. */
  body.pip { padding: 8px; }
  body.pip .wrap { height: calc(100dvh - 16px); display: flex; flex-direction: column; }
  body.pip header { gap: 6px; margin-bottom: 8px; flex: none; }
  body.pip h1, body.pip .newver, body.pip #legend, body.pip .ver,
  body.pip .controls > :not(#viewSeg):not(#qualSeg) { display: none !important; }
  body.pip .controls { width: auto; padding: 0; border: 0; }
  body.pip .chip { padding: 2px 6px; font-size: 11px; }
  body.pip .summary { gap: 4px; width: auto; margin-left: 0; }
  body.pip #officeWrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.pip .office { flex: 1; height: auto; min-height: 120px; }
  body.pip #main { overflow: auto; min-height: 0; }
  body.pip #main:empty { display: none; }
  body.pip section { margin-top: 12px; }
  body.pip section:first-child { margin-top: 0; }
  body.pip .grid { grid-template-columns: 1fr; }

<script>
// Language: your pick in the 🌐 menu, else the language of your prompts
// (the server guesses it), else the browser's, else English.
let L = I18N.en;
let langCode = 'en';
let rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto', style: 'short' });
function chooseLang(serverGuess) {
  const pick = store.get('lang', 'auto');
  if (pick !== 'auto' && I18N[pick]) return pick;
  if (serverGuess && I18N[serverGuess]) return serverGuess;
  const guess = i18nFromBrowser(navigator.languages || [navigator.language]);
  // This board is read in Chinese; any zh variant lands on Traditional Chinese,
  // and a browser we can't place still gets Chinese rather than English.
  if (guess && I18N[guess]) return guess.startsWith('zh') ? 'zh-TW' : guess;
  return 'zh-TW';
}
function applyLang(code) {
  if (code === langCode && L === I18N[code] && document.documentElement.dataset.localized) return;
  document.documentElement.dataset.localized = 'true';
  langCode = code;
  L = I18N[code];
  document.documentElement.lang = L.html;
  rtf = new Intl.RelativeTimeFormat(L.html, { numeric: 'auto', style: 'short' });
  // New keys fall back to English until every translation catches up.
  const t = (k) => L[k] ?? I18N.en[k] ?? k;
  document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = t(el.dataset.t)));
  document.querySelectorAll('[data-a]').forEach((el) => { const v = t(el.dataset.a); el.setAttribute('aria-label', v); el.title = v; });
  const searchEl = document.getElementById('wbSearch');
  if (searchEl) searchEl.placeholder = t('searchPlaceholder');
  if (typeof syncViewSeg === 'function') syncViewSeg();
  requestAnimationFrame(syncTopbar);
  const legend = document.getElementById('legend');
  if (legend) legend.innerHTML = ['thinking', 'tool', 'typing', 'waiting', 'done', 'error', 'interrupted', 'idle']
    .map((k) => `<span data-s="${k}"><span class="dot" style="color:var(--s)"></span>${L[k]}</span>`).join('');
  if (typeof renderLangMenu === 'function') renderLangMenu();
  if (typeof office !== 'undefined' && office) office.offDutyLabel = L.wentHome;
  if (typeof syncControls === 'function') syncControls();
  if (typeof renderSceneSel === 'function') renderSceneSel();
  if (typeof renderVersion === 'function') renderVersion();
  window.Workbench?.onLang?.();
}

const store = (() => {
  const fallback = new Map();
  const get = (k, d) => { try { const v = localStorage.getItem('wmad.' + k); return v == null ? d : JSON.parse(v); } catch { return fallback.has(k) ? fallback.get(k) : d; } };
  const set = (k, v) => { fallback.set(k, v); try { localStorage.setItem('wmad.' + k, JSON.stringify(v)); } catch {} };
  return { get, set };
})();

const PREF_DEFAULTS = { view: 'workbench', quality: 'mid', scene: 'office', agents: [], showSub: false, showIdle: false, showAgent: true, sound: true, notify: true, side: true, lang: 'auto', theme: 'auto' };
function validAgentId(v) {
  return typeof v === 'string' && v !== 'all' && /^[a-zA-Z][a-zA-Z0-9_-]{0,63}$/.test(v) && !Object.hasOwn(Object.prototype, v);
}
function validPreference(k, v) {
  if (!Object.hasOwn(PREF_DEFAULTS, k)) return false;
  if (typeof PREF_DEFAULTS[k] === 'boolean') return typeof v === 'boolean';
  if (k === 'view') return ['workbench', 'timeline', 'office', 'topo', 'list'].includes(v);
  if (k === 'quality') return ['mid', 'high'].includes(v);
  if (k === 'theme') return ['auto', 'dark', 'light'].includes(v);
  // Which agents to show; none selected means all of them.
  if (k === 'agents') return Array.isArray(v) && v.length <= 32 && v.every(validAgentId);
  if (k === 'lang') return v === 'auto' || Object.hasOwn(I18N, v);
  return typeof v === 'string' && /^[a-z0-9-]+$/.test(v);
}
// The filter used to be one agent or 'all'; carry an old single choice over once.
{
  const old = store.get('agent', 'all');
  if (validAgentId(old) && !store.get('agents', []).length) store.set('agents', [old]);
  if (old !== 'all') store.set('agent', 'all');
}
// The redesign opens on the workbench once; afterwards the last view sticks.
// (A ?view= URL parameter is applied later and still wins.)
if (store.get('viewV', 0) !== 2) { store.set('view', 'workbench'); store.set('viewV', 2); }
function readPreferences() {
  return Object.fromEntries(Object.entries(PREF_DEFAULTS).map(([k, d]) => {
    const v = store.get(k, d);
    return [k, validPreference(k, v) ? v : d];
  }));
}
// Theme: follow the system unless the person picked dark or light. Canvas
// renderers cannot read CSS variables, so keep a colour cache refreshed
// whenever the theme may have changed.
let themeColors = null;
function readThemeColors() {
  const css = getComputedStyle(document.documentElement);
  const v = (n, fallback) => css.getPropertyValue(n).trim() || fallback;
  themeColors = {
    ink: v('--ink', '#241f18'),
    muted: v('--muted', '#6c6355'),
    faint: v('--faint', '#9b917f'),
    line: v('--line', '#d9cfbd'),
    panel: v('--panel', '#f7f3ea'),
    bg: v('--bg', '#ece5d6'),
    st: {
      thinking: v('--st-thinking', '#6f5a9e'),
      tool: v('--st-tool', '#3f6f93'),
      typing: v('--st-typing', '#4f7d44'),
      waiting: v('--st-waiting', '#a8741f'),
      done: v('--st-done', '#5c7550'),
      error: v('--st-error', '#b0412f'),
      interrupted: v('--st-interrupted', '#8a8072'),
      idle: v('--st-interrupted', '#8a8072'),
    },
  };
}
function syncTheme() {
  document.querySelectorAll('#themeSeg button').forEach((b) => {
    const on = b.dataset.themeV === state.theme;
    b.classList.toggle('on', on);

// Top-bar heartbeat: active sessions sampled every 10 s, 60 samples = 10 min.
const HB_LEN = 60;
const hbPoints = [];

function drawHeartbeat() {
  const line = document.getElementById('hbLine');
  if (!line) return;
  const max = Math.max(1, ...hbPoints);
  const min = Math.min(...hbPoints);
  const span = max - min;
  line.setAttribute('points', hbPoints.map((v, i) => {
    const x = (i * 72) / (HB_LEN - 1);
    const y = span ? 16 - ((v - min) / span) * 13 : 9;
    return `${x.toFixed(2)},${y.toFixed(2)}`;
  }).join(' '));
}
function sampleHeartbeat() {
  if (!state.loaded) return;
  const n = state.data.sessions.filter((s) => ACTIVE.has(s.status)).length;
  if (!hbReady) {
    for (let i = 0; i < HB_LEN; i++) hbPoints.push(n);
    hbReady = true;
  } else {
    hbPoints.push(n);
    if (hbPoints.length > HB_LEN) hbPoints.shift();

}

function esc(s) {

}

function dur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${String(m % 60).padStart(2, '0')}m`;
}

function ago(t, now) {
  const s = Math.round((t - now) / 1000);
  if (s > -45) return rtf.format(0, 'second');
  const m = Math.round(s / 60);
  if (m > -60) return rtf.format(m, 'minute');
  const h = Math.round(m / 60);
  if (h > -24) return rtf.format(h, 'hour');
  return rtf.format(Math.round(h / 24), 'day');
}

function timeLabel(s, now) {

  if (s.agent === 'copilot') return `${cd}copilot --resume ${shq(s.sessionId || s.id)}`;

function card(s, now) {

function onData(data) {
  for (const s of data.sessions) {
    if (!validAgentId(s.agent)) continue;
    if (!Object.hasOwn(AGENT_NAME, s.agent)) AGENT_NAME[s.agent] = s.agentName || s.agent;
  }
  state.skew = Date.now() - data.now;
  const first = state.prev.size === 0;
  state.flash.clear();
  for (const s of data.sessions) {
    const before = state.prev.get(s.key);
    const wasStuck = state.prevStuck.has(s.key);
    const needsYou = s.status === 'waiting' || s.status === 'error';
    let alert = null;
    if (!first && before && before !== s.status && (needsYou || (s.status === 'done' && ACTIVE.has(before)))) {
      alert = s.status === 'done' ? L.doneNote(s.project || s.agent) : `${s.project || s.agent}: ${L[s.status]}`;
    } else if (!first && s.stuck && !wasStuck) {
      alert = `${s.project || s.agent}: ${L.stuck(s.stuck)}`;
    }
    if (alert) {
      state.flash.add(s.key);
      if (!PIP && !s.subagent) {
        if (state.notify && window.Notification && Notification.permission === 'granted') {
          try { new Notification(alert, { body: s.reply || s.activity || '', tag: s.key }); } catch {}
        }
        if (state.sound) chime(s.status === 'done' && !s.stuck ? 'done' : 'attention');
      }
    }
    state.prev.set(s.key, s.status);
    if (s.stuck) state.prevStuck.add(s.key); else state.prevStuck.delete(s.key);
  }
  state.data = data;
  state.loaded = true;
  if (!hbReady) sampleHeartbeat();
  syncControls();
  applyLang(chooseLang(data.lang));
  render();
}

// A short synthesized chime, so no audio file is bundled: one tone when a turn
// finishes, two rising tones when an agent needs you or looks stuck.
let audio = null;
function chime(kind) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const notes = kind === 'done' ? [660] : [587, 880];
    notes.forEach((f, i) => {
      const t = audio.currentTime + i * 0.16, o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + 0.4);
    });
  } catch {}
}

    const u = shotUrl(key, im);
    return `<button data-shot="${u}" data-cap="${esc(m.name || '')} · 圖 ${i + 1}" title="點開看大圖"><img loading="lazy" src="${u}" alt=""></button>`;
  }).join('');
  const res = m.result && m.result.text
    ? `<details class="fold"><summary><div class="res clamp c2">${esc(m.result.text)}</div></summary></details>` : '';
  return `<div class="blk tool"><div class="blk-title"><span class="nm">${esc(m.name || '工具')}</span>${m.at ? `<span class="n">${hhmm(m.at)}</span>` : ''}</div>`
    + `<div class="arg">${esc(m.text || '')}</div>${res}${shots ? `<div class="shots">${shots}</div>` : ''}</div>`;
}
function blkFinal(m) {
  const bits = [];
  if (Number.isFinite(m.cost)) bits.push(`$${m.cost.toFixed(3)}`);
  if (m.turns) bits.push(`${m.turns} 轮`);
  return `<div class="blk final${m.isError ? ' is-error' : ''}"><div class="blk-title">${m.isError ? '最终错误' : '最终答复'}<span class="n">${esc(bits.join(' · '))}</span></div>${foldBlock(m.text || '', 12)}</div>`;
}
function renderTranscript(messages, key) {
  return `<div class="tscript">${messages.map((m) => {
    if (m.role === 'user') return blkPrompt(m);
    if (m.role === 'thinking') return blkThink(m);
    if (m.role === 'tool') return blkTool(m, key);
    if (m.role === 'final') return blkFinal(m);
    if (m.role === 'assistant') return blkSay(m);
    return m.text ? `<div class="msgs-note">${esc(m.text)}</div>` : '';
  }).join('')}</div>`;
}

function renderDetail(scrollDown) {
  const s = state.data.sessions.find((x) => x.key === sel);
  if (!s) { closeDetail(); return; }
  const now = Date.now() - state.skew;
  document.getElementById('detailTitle').innerHTML = `${agentLogo(s.agent)}${esc(taskTag(s) ? `${taskTag(s)} · ${s.project || ''}` : (s.project || AGENT_NAME[s.agent] || s.agent))}`;
  // Fetch again whenever the agent logged something new.
  if (convo.at !== s.lastEventAt && !convo.busy) loadConvo(s);
  const body = document.getElementById('detailBody');
  const nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
  const msgs = convo.private ? `<div class="msgs-note">${esc(L.privateNote)}</div>`
    : convo.messages == null ? `<div class="msgs-note">${esc(L.loadingMsgs)}</div>`
      : !convo.messages.length ? `<div class="msgs-note">${esc(L.noMessages)}</div>`
        : renderTranscript(convo.messages, s.key);
  const resume = resumeCmd(s);
  const rows = [[L.modelL, s.model || '—']];
  if (s.effort) rows.push(['思考档位', s.effort]);
  if (Number.isFinite(s.cost)) rows.push(['成本', `$${s.cost.toFixed(3)}`, 1]);
  if (s.turns) rows.push(['轮次', String(s.turns), 1]);
  if (s.thinkingTokens > 999) rows.push(['思考量', fmtTokens(s.thinkingTokens), 1]);
  if (s.images) rows.push(['图片', `${s.images} 张`, 1]);
  if (s.run) rows.push(['记录', s.run]);
  if (s.sessionId) rows.push(['工作阶段', s.sessionId.slice(0, 8)]);
  rows.push([L.folderL, s.cwd || '—']);
  rows.push([L.today, s.today ? `${s.today.turns} ${L.turnsL} · ${fmtTokens(s.today.tokens)}` : '—', 1]);
  const html = `
    ${s.title && s.title !== s.project ? `<div class="dtitle">${esc(s.title)}</div>` : ''}
    <div class="dstatus" style="--s:${statusColor(s.status)}"><i></i><b class="${s.status === 'thinking' ? 'ui-shimmer' : ''}">${esc(L[s.status] || s.status)}</b>${s.activity ? `<span class="act">${esc(s.activity)}</span>` : ''}${s.stuck ? `<span class="stuck">${esc(L.stuck(s.stuck))}</span>` : ''}</div>
    <dl class="dmeta">
      ${rows.map(([k, v, num]) => `<dt>${esc(k)}</dt><dd class="${k === L.folderL || k === '记录' ? 'mono' : ''}${num ? ' ui-num' : ''}" title="${esc(v)}">${esc(v)}</dd>`).join('')}
      <dt></dt><dd class="ui-num" data-time="${esc(s.key)}"></dd>
    </dl>
    ${contextBar(s.context)}
    ${resume ? `<div class="dactions"><button class="copy" data-copy="${esc(resume)}">${L.copy}</button></div>` : ''}
    <div class="side-sec">全程 · 逐字稿</div>
    ${msgs}`;
  // The turn timer ticks on its own (tickTimes), so the panel only redraws when something changed.
  if (body.dataset.html !== html) {
    body.innerHTML = html; body.dataset.html = html;
    const t = body.querySelector('[data-time]'); if (t) t.textContent = timeLabel(s, now);
    if (scrollDown || nearBottom) body.scrollTop = body.scrollHeight;
  }
}
const GEAR = '<svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>';

async function loadConvo(s, target = convo, done) {
  const key = s.key, at = s.lastEventAt;
  target.busy = true;
  try {
    const r = await fetch(`/api/transcript?key=${encodeURIComponent(key)}`);
    const d = await r.json().catch(() => ({}));
    if (target.key !== key) return;
    target.key = key;
    target.at = at;
    target.messages = Array.isArray(d.messages) ? d.messages : [];
    target.private = !!d.private;
    target.busy = false;
  } catch {
    if (target.key === key) target.busy = false;
    return;
  }
  if (done) done();
  else if (sel === key) renderDetail();
}

document.getElementById('sideHide').addEventListener('click', () => setSide(false));
document.getElementById('sideTab').addEventListener('click', () => setSide(true));
document.getElementById('sideBack').addEventListener('click', closeDetail);
document.getElementById('sideRows').addEventListener('mouseleave', (e) => { if (e.currentTarget.dataset.stale) renderSide(); });
document.getElementById('sideRows').addEventListener('click', (e) => {
  const b = e.target.closest('.srow'); if (b) openDetail(b.dataset.key);
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('input, select, textarea, [contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape' && state.full && sel) closeDetail();
});
addEventListener('resize', () => { if (!state.full) return; measureBar(); office?.setInset(panelInset(), false); });
if (state.full) {
  document.body.classList.add('full');
  requestAnimationFrame(measureBar);
  // On a phone the panel would cover the office, so it starts folded away.
  setSide(state.side && !matchMedia('(max-width: 760px)').matches, false);
  syncFull();
}

setInterval(tickTimes, 1000);

// ---- 拓扑 view: the brain in the middle-left, its hired hands fanned out to the
// right, each edge a delegation that is still running (dashes crawl) or done.
const topoCanvas = document.getElementById('topoCanvas');
const topoCtx = topoCanvas.getContext('2d');
let topoGroups = [];
let topoRects = [];
let topoRaf = 0;
const TOPO = { rowH: 40, rowGap: 12, rootW: 236, kidW: 268, gapX: 92, padX: 28, clusterGap: 26 };

function topoOf(list) {
  const byId = new Map();
  for (const s of list) {
    byId.set(s.id, s);
    if (s.sessionId) byId.set(s.sessionId, s);
  }
  const kids = new Map();
  const roots = [];
  for (const s of list) {
    const p = s.parentId ? byId.get(s.parentId) : null;
    if (p && p.key !== s.key) {
      if (!kids.has(p.key)) kids.set(p.key, []);
      kids.get(p.key).push(s);
    } else roots.push(s);
  }
  const order = (a, b) => (b.startedAt || 0) - (a.startedAt || 0);
  const clusters = roots.map((r) => ({ root: r, kids: (kids.get(r.key) || []).sort(order) }));
  // Real delegation trees first, then whoever is still running; idle leftovers last.
  const rank = (c) => (c.kids.length ? 0 : ACTIVE.has(c.root.status) ? 1 : 2);
  return clusters.sort((a, b) => rank(a) - rank(b) || order(a.root, b.root));
}

function topoTrunc(ctx, text, max) {
  let t = String(text || '');
  if (ctx.measureText(t).width <= max) return t;
  while (t.length > 1 && ctx.measureText(t + '…').width > max) t = t.slice(0, -1);
  return t + '…';
}

function paintTopo(t) {
  const el = topoCanvas;
  const wrap = document.getElementById('topoWrap');
  const viewW = Math.max(420, wrap.clientWidth || 900);
  const viewH = Math.max(320, wrap.clientHeight || 600);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const groups = topoGroups;
  const colW = TOPO.rootW + TOPO.gapX + TOPO.kidW;
  const { ink, muted, faint, line, panel, bg } = themeColors;
  topoRects = [];

  // Pack clusters into columns top-down, then let the wrapper scroll. Type stays
  // at 1:1 instead of shrinking to an unreadable smear when there are dozens.
  const measured = groups.map((g) => {
    const n = Math.max(1, g.kids.length);
    return { g, h: n * TOPO.rowH + (n - 1) * TOPO.rowGap };
  });
  const limit = viewH - TOPO.padX * 2;
  const cols = [[]];
  let colH = 0;
  for (const m of measured) {
    if (cols[cols.length - 1].length && colH + m.h > limit) { cols.push([]); colH = 0; }
    cols[cols.length - 1].push(m);
    colH += m.h + TOPO.clusterGap;
  }
  const colHeights = cols.map((c) => c.reduce((n, m) => n + m.h + TOPO.clusterGap, 0) - TOPO.clusterGap);
  const canvasW = Math.max(viewW, cols.length * colW + TOPO.padX * 2 - TOPO.gapX);
  const canvasH = Math.max(viewH, Math.max(0, ...colHeights) + TOPO.padX * 2);
  el.style.width = `${canvasW}px`;
  el.style.height = `${canvasH}px`;
  if (el.width !== Math.round(canvasW * dpr) || el.height !== Math.round(canvasH * dpr)) {
    el.width = Math.round(canvasW * dpr);
    el.height = Math.round(canvasH * dpr);
  }
  const c = topoCtx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, canvasW, canvasH);
  c.fillStyle = bg; c.fillRect(0, 0, canvasW, canvasH);

  if (!groups.length) {
    c.fillStyle = faint; c.font = '13px ui-sans-serif, "PingFang TC", sans-serif'; c.textAlign = 'center';
    c.fillText('目前没有主控或子代理在运作', canvasW / 2, canvasH / 2);
    return;
  }

  c.textBaseline = 'alphabetic';
  cols.forEach((column, ci) => {
    const x0 = TOPO.padX + ci * colW;
    let y = TOPO.padX;
    for (const { g, h } of column) {
      const rootY = y + (h - TOPO.rowH) / 2;
      const kidX = x0 + TOPO.rootW + TOPO.gapX;
      // edges first so the cards sit on top of them
      g.kids.forEach((k, i) => {
        const ky = y + i * (TOPO.rowH + TOPO.rowGap) + TOPO.rowH / 2;
        const active = ACTIVE.has(k.status);
        const col = themeColors.st[k.status] || faint;
        c.strokeStyle = col; c.globalAlpha = active ? .8 : .35;
        c.lineWidth = 1.2;
        if (active) { c.setLineDash([5, 4]); c.lineDashOffset = -(t / 55) % 9; } else c.setLineDash([]);
        const x1 = x0 + TOPO.rootW, y1 = rootY + TOPO.rowH / 2, x2 = kidX, y2 = ky;
        const mx = (x1 + x2) / 2;
        c.beginPath(); c.moveTo(x1, y1); c.bezierCurveTo(mx, y1, mx, y2, x2, y2); c.stroke();
        c.setLineDash([]); c.globalAlpha = 1;
      });
      drawTopoBox(c, x0, rootY, TOPO.rootW, TOPO.rowH, g.root, 1, ink, muted, faint, line, panel, t);
      g.kids.forEach((k, i) => {
        const ky = y + i * (TOPO.rowH + TOPO.rowGap);
        drawTopoBox(c, kidX, ky, TOPO.kidW, TOPO.rowH, k, 1, ink, muted, faint, line, panel, t);
      });
      y += h + TOPO.clusterGap;
    }
  });
}
function drawTopoBox(c, x, y, w, h, s, scale, ink, muted, faint, line, panel, t) {
  const col = themeColors.st[s.status] || faint;
  const active = ACTIVE.has(s.status);
  c.save();
  // paper card
  c.fillStyle = panel; c.globalAlpha = 0.96;
  c.strokeStyle = line; c.lineWidth = 1;
  const r = 3;
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
  c.closePath(); c.fill(); c.globalAlpha = 1; c.stroke();
  // status spine
  c.fillStyle = col; c.fillRect(x, y + 1, Math.max(2, 3 * scale), h - 2);
  // pulse for live ones
  if (active) {
    const a = 0.18 + 0.14 * Math.sin(t / 420);
    c.globalAlpha = a; c.fillStyle = col; c.fillRect(x, y, w, h); c.globalAlpha = 1;
  }
  const padX = 10 * scale;
  c.font = `${Math.max(10, 12.5 * scale)}px ui-sans-serif, "PingFang TC", sans-serif`;
  const tag = taskTag(s);
  const name = tag ? `${tag} · ${s.project || ''}` : (s.project || AGENT_NAME[s.agent] || s.agent);
  c.fillStyle = ink; c.textBaseline = 'alphabetic';
  c.fillText(topoTrunc(c, name, w - padX * 2), x + padX, y + h * 0.46);
  // status line
  const fits = Math.max(8, 10.5 * scale);
  c.font = `${fits}px ui-monospace, "PingFang TC", monospace`;
  const st = L[s.status] || s.status;
  const extra = (s.activity || '').replace(/\s+/g, ' ').slice(0, 46);
  c.fillStyle = muted;
  c.fillText(topoTrunc(c, `${st}${extra ? ' · ' + extra : ''}`, w - padX * 2), x + padX, y + h * 0.82);
  c.restore();
  topoRects.push({ x, y, w, h, key: s.key });
}
function topoLoop(t) {
  if (state.view !== 'topo') { cancelAnimationFrame(topoRaf); topoRaf = 0; return; }
  paintTopo(t);
  topoRaf = requestAnimationFrame(topoLoop);
}
function drawTopo() {
  const list = visible();
  topoGroups = topoOf(list);
  paintTopo(performance.now());
  if (!topoRaf) topoRaf = requestAnimationFrame(topoLoop);
}
topoCanvas.addEventListener('click', (e) => {
  const r = topoCanvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = topoRects.find((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  if (hit) openDetail(hit.key);
});
topoCanvas.addEventListener('mousemove', (e) => {
  const r = topoCanvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = topoRects.some((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  topoCanvas.style.cursor = hit ? 'pointer' : 'default';
});
addEventListener('resize', () => { if (state.view === 'topo') drawTopo(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  readThemeColors();
  window.dispatchEvent(new Event('wmad:theme'));
  if (state.view === 'topo') drawTopo();
});

// ---- image lightbox: thumbnails from the run log open full size
const lightbox = document.getElementById('lightbox');
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-shot]');
  if (b) {
    const img = lightbox.querySelector('img');
    img.src = b.dataset.shot;
    lightbox.querySelector('.cap').textContent = b.dataset.cap || '';
    lightbox.classList.add('on');
    return;
  }
  if (lightbox.classList.contains('on') && (e.target === lightbox || e.target.closest('#lightbox'))) {
    lightbox.classList.remove('on');
    lightbox.querySelector('img').src = '';
  }
  // a card in the list view opens that agent, like clicking its person does
  const cardEl = e.target.closest('#main .card[data-key]');
  if (cardEl && !e.target.closest('[data-copy]')) openDetail(cardEl.dataset.key);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('on')) {
    lightbox.classList.remove('on');
    lightbox.querySelector('img').src = '';
  }
});
